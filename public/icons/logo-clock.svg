<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Clock reading on time">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b91ff"/>
      <stop offset="1" stop-color="#2f6df6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1f497d" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- face -->
  <circle cx="120" cy="120" r="104" fill="#ffffff" filter="url(#soft)"/>
  <circle cx="120" cy="120" r="104" fill="none" stroke="url(#ring)" stroke-width="11"/>

  <!-- hour ticks -->
  <g stroke="#2f6df6" stroke-width="6" stroke-linecap="round">
    <line x1="120" y1="30" x2="120" y2="46"/>
    <line x1="120" y1="194" x2="120" y2="210"/>
    <line x1="30" y1="120" x2="46" y2="120"/>
    <line x1="194" y1="120" x2="210" y2="120"/>
  </g>
  <g stroke="#a9c6ff" stroke-width="4" stroke-linecap="round">
    <line x1="166" y1="42" x2="159" y2="54"/>
    <line x1="198" y1="74" x2="186" y2="81"/>
    <line x1="198" y1="166" x2="186" y2="159"/>
    <line x1="74" y1="42" x2="81" y2="54"/>
    <line x1="42" y1="74" x2="54" y2="81"/>
  </g>

  <!-- hands at 10:10 -->
  <line x1="120" y1="120" x2="80" y2="94" stroke="#16324f" stroke-width="9" stroke-linecap="round"/>
  <line x1="120" y1="120" x2="158" y2="84" stroke="#16324f" stroke-width="7" stroke-linecap="round"/>
  <circle cx="120" cy="120" r="9" fill="#16324f"/>

  <!-- ON TIME badge -->
  <rect x="69" y="150" width="102" height="32" rx="16" fill="#2bb673"/>
  <text x="120" y="172" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#ffffff" letter-spacing="1.5">ON TIME</text>
</svg>
