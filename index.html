<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1f2933" />
  <meta name="description" content="TimeIT — a fast, offline-first time tracker. Track time with one click." />
  <title>TimeIT — simple time tracking</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-bar">
    <div class="brand">
      <span class="brand-mark">⏱</span>
      <span class="brand-name">TimeIT</span>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab is-active" data-view="track" role="tab">Track</button>
      <button class="tab" data-view="reports" role="tab">Reports</button>
      <button class="tab" data-view="projects" role="tab">Projects</button>
    </nav>
    <button class="icon-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">◐</button>
  </header>

  <main class="content">
    <!-- TRACK VIEW -->
    <section class="view is-active" id="view-track">
      <!-- Live timer bar -->
      <div class="timer-card">
        <input
          type="text"
          id="timer-description"
          class="timer-input"
          placeholder="What are you working on?"
          autocomplete="off"
        />
        <div class="timer-controls">
          <select id="timer-project" class="project-select" aria-label="Project"></select>
          <div class="timer-readout" id="timer-readout">0:00:00</div>
          <button class="start-btn" id="start-stop-btn" aria-label="Start timer">
            <span class="start-icon">▶</span>
          </button>
        </div>
      </div>

      <!-- Manual add -->
      <div class="manual-add">
        <button class="link-btn" id="manual-add-btn">+ Add time manually</button>
      </div>

      <!-- Entries grouped by day -->
      <div id="entries-list" class="entries-list">
        <p class="empty-state" id="entries-empty">No time tracked yet. Hit ▶ to start your first timer.</p>
      </div>
    </section>

    <!-- REPORTS VIEW -->
    <section class="view" id="view-reports">
      <div class="report-controls">
        <div class="range-picker">
          <button class="chip is-active" data-range="day">Today</button>
          <button class="chip" data-range="week">This week</button>
          <button class="chip" data-range="month">This month</button>
        </div>
        <button class="link-btn" id="export-btn">Export CSV</button>
      </div>
      <div class="report-total">
        <span class="report-total-label">Total</span>
        <span class="report-total-value" id="report-total-value">0:00:00</span>
      </div>
      <div id="report-breakdown" class="report-breakdown"></div>
    </section>

    <!-- PROJECTS VIEW -->
    <section class="view" id="view-projects">
      <form class="project-form" id="project-form">
        <input type="text" id="new-project-name" placeholder="New project name" autocomplete="off" required />
        <input type="color" id="new-project-color" value="#4f86f7" aria-label="Project color" />
        <button type="submit" class="btn-primary">Add</button>
      </form>
      <ul class="project-manage-list" id="project-manage-list"></ul>
    </section>
  </main>

  <!-- Entry edit / manual add modal -->
  <div class="modal-backdrop" id="entry-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="entry-modal-title">
      <h2 id="entry-modal-title">Edit entry</h2>
      <label>Description
        <input type="text" id="edit-description" autocomplete="off" />
      </label>
      <label>Project
        <select id="edit-project"></select>
      </label>
      <div class="time-row">
        <label>Start
          <input type="datetime-local" id="edit-start" />
        </label>
        <label>End
          <input type="datetime-local" id="edit-end" />
        </label>
      </div>
      <div class="modal-actions">
        <button class="btn-danger" id="edit-delete">Delete</button>
        <span class="spacer"></span>
        <button class="btn-ghost" id="edit-cancel">Cancel</button>
        <button class="btn-primary" id="edit-save">Save</button>
      </div>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/format.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
